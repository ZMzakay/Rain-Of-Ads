<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totally Legit Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px;
            text-align: center;
            overflow-x: hidden;
            /* Make the body tall enough to scroll so ads can spread everywhere */
            min-height: 250vh; 
        }

        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        #counter {
            font-weight: bold;
            color: #d9534f;
        }

        /* Real Ad Styled Simulation */
        .fake-ad {
            position: absolute;
            width: 300px;
            height: 250px; /* Standard Medium Rectangle banner size */
            background: #ffffff;
            border: 1px solid #dcdcdc;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            z-index: 1000;
            padding: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            border-radius: 4px;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            user-select: none;
            overflow: hidden;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Fake Google/AdChoices top header to look authentic */
        .ad-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f3f4;
            padding: 2px 6px;
            box-sizing: border-box;
            font-size: 9px;
            color: #5f6368;
            font-family: sans-serif;
            border-bottom: 1px solid #e0e0e0;
        }

        .ad-header-left {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .ad-badge {
            background: #f4b400;
            color: #000;
            font-weight: bold;
            padding: 1px 3px;
            border-radius: 2px;
            font-size: 8px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #70757a;
            font-size: 14px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .close-btn:hover {
            color: #000;
        }

        /* Ad Content Area */
        .ad-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .ad-content h4 {
            margin: 0 0 8px 0;
            color: #1a0dab;
            font-size: 15px;
            line-height: 1.2;
            text-decoration: underline;
        }

        .ad-content p {
            margin: 0 0 12px 0;
            font-size: 11px;
            color: #4d5156;
            line-height: 1.3;
        }

        .ad-cta {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .ad-cta:hover {
            background: #1557b0;
        }

        .ad-img-placeholder {
            width: 100%;
            height: 90px;
            background: #e8eaed;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #70757a;
            margin-bottom: 8px;
            border-radius: 2px;
            border: 1px dashed #bdc1c6;
        }
    </style>
</head>
<body>

    <h1>Welcome to Our Totally Normal Webpage!</h1>
    <p>Please browse around. Active ads on screen: <span id="counter">0</span></p>
    <p><em>(Scroll down, scroll up, they are everywhere...)</em></p>

    <script>
        let adCount = 0;
        const counterEl = document.getElementById('counter');

        const adTemplates = [
            { brand: "Amazon Ads", title: "Apple iPhone 15 Pro Max - 90% Off Today Only", text: "Liquidated overstock inventory from local fulfillment centers. Claim yours now!", cta: "Claim Deal" },
            { brand: "Microsoft Security", title: "CRITICAL ALERT: Troj/Agent-Gen Detected", text: "Your Windows Defender is disabled. Run instant system recovery scan.", cta: "Fix Now" },
            { brand: "LocalMeetups", title: "Single Women in Saint-Jorioz Want to Chat", text: "No credit card required. 100% free registration for verified local profiles.", cta: "Start Chat" },
            { brand: "CryptoFuture", title: "Elon Musk's New Trading Platform Explodes", text: "Turn $250 into $4,300 in less than 48 hours with automated AI trading bots.", cta: "Invest Fast" },
            { brand: "CookieMonster Inc.", title: "You Must Accept All Cookies to Proceed", text: "By order of regional internet compliance laws, accept cookies to view content.", cta: "Accept All" },
            { brand: "SpeedBoost Pro", title: "Your RAM Usage is at 98% Critical Capacity", text: "Click here to flush system memory and accelerate web browser performance.", cta: "Optimize" }
        ];

        function spawnAd() {
            adCount++;
            counterEl.textContent = adCount;

            const ad = document.createElement('div');
            ad.className = 'fake-ad';

            const template = adTemplates[Math.floor(Math.random() * adTemplates.length)];

            // FIX: Extended boundaries completely across the entire document width and scrollable height
            // Using document.documentElement.scrollWidth / scrollHeight ensures absolute coverage everywhere.
            const maxX = Math.max(0, document.documentElement.scrollWidth - 320);
            const maxY = Math.max(0, document.documentElement.scrollHeight - 270);
            
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            ad.style.left = `${randomX}px`;
            ad.style.top = `${randomY}px`;

            ad.innerHTML = `
                <div class="ad-header">
                    <div class="ad-header-left">
                        <span class="ad-badge">Ad</span>
                        <span>${template.brand}</span>
                    </div>
                    <button class="close-btn" onclick="multiplyAds(event, this)">✕</button>
                </div>
                <div class="ad-content">
                    <div class="ad-img-placeholder">[ Sponsored Display Asset ]</div>
                    <h4>${template.title}</h4>
                    <p>${template.text}</p>
                    <button class="ad-cta" onclick="multiplyAds(event, this)">${template.cta}</button>
                </div>
            `;

            // Clicking anywhere else on the ad multiplies them
            ad.addEventListener('click', (e) => {
                if(e.target.tagName !== 'BUTTON' && !e.target.classList.contains('close-btn')) {
                    spawnAd();
                    spawnAd();
                }
            });

            document.body.appendChild(ad);
        }

        // Clicking close button or CTA multiplies ads instead of closing them safely
        function multiplyAds(event, element) {
            event.stopPropagation();
            
            const adElement = element.closest('.fake-ad');
            if(adElement) {
                adElement.remove();
                adCount = Math.max(0, adCount - 1);
            }

            // Punishment multiplier: spawns 2 to 4 new ones
            spawnAd();
            spawnAd();
            spawnAd();
            if(Math.random() > 0.4) spawnAd();
        }

        let intervalTime = 800; // Faster initial drop rate
        
        function startChaos() {
            spawnAd();
            
            // Accelerates exponentially down to 80ms interval
            if (intervalTime > 80) {
                intervalTime -= 15;
            }
            
            setTimeout(startChaos, intervalTime);
        }

        // Trigger chaos quickly after load
        setTimeout(startChaos, 1000);
    </script>

</body>
</html>
